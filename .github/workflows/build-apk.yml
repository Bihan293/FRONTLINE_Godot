name: Build Godot 4 Android APK and Create Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    name: Export Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses and verify tools
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" || true

      - name: Generate Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Download Godot 4.3 and Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Configure Godot Editor Settings
        run: |
          chmod +x scripts/setup_godot_ci.sh
          bash scripts/setup_godot_ci.sh

      - name: Pre-heat Godot Cache
        run: |
          godot --headless --editor --quit || true

      - name: Import project resources
        run: godot --headless --path . --import

      - name: Run gameplay smoke tests
        run: |
          godot --headless --path . res://tests/pause_smoke.tscn --quit-after 1200
          godot --headless --path . res://tests/navigation_smoke.tscn --quit-after 1800
          godot --headless --path . res://tests/gameplay_smoke.tscn --quit-after 1800
          godot --headless --path . res://tests/projectile_smoke.tscn --quit-after 1800

      - name: Build Android APK with Godot
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" ./build/FRONTLINE.apk
          ls -lh build/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FRONTLINE-apk
          path: build/FRONTLINE.apk
          retention-days: 14

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v0.1.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "FRONTLINE ${{ steps.release_info.outputs.tag }}"
          body: |
            ## 🎮 FRONTLINE Mobile APK (${{ steps.release_info.outputs.tag }})

            Автоматическая сборка для Android.

            ### 📲 Скачать игру на телефон:
            Скачайте файл **`FRONTLINE.apk`** в блоке Assets ниже и установите на Android-устройство.

            ### 📦 Информация о сборке:
            - **Godot версия:** 4.3 Stable
            - **Ветка:** `${{ github.ref_name }}`
            - **Коммит:** `${{ steps.release_info.outputs.short_sha }}`
          files: |
            build/FRONTLINE.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
